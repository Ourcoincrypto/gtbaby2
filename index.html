<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>BABY MAYHEM: Cradle of Chaos — 3D</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; font-family: system-ui; }
    canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
    #title { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #1a1a2e, #16213e); display: flex; flex-direction: column; justify-content: center; align-items: center; color: #fff; z-index: 300; }
    #title h1 { font-size: 3em; margin: 0; color: #ff006e; text-shadow: 0 0 20px #ff006e; }
    #title button { margin-top: 30px; padding: 15px 40px; font-size: 1.5em; background: #ff006e; border: none; border-radius: 8px; color: white; cursor: pointer; box-shadow: 0 0 20px #ff006e; }
    #hud { position: absolute; top: 10px; left: 10px; color: #0f0; font-family: monospace; font-size: 18px; z-index: 100; pointer-events: none; text-shadow: 2px 2px #000; }
  </style>
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
</head>
<body>
  <div id="title">
    <h1>BABY MAYHEM</h1>
    <p>Cradle of Chaos — 3D</p>
    <button id="startBtn">WAKE UP</button>
  </div>
  <div id="hud">Health: 100 | Chaos: 0 | Weapon: None</div>
  
  <script>
    // NO IMPORTMAPS - works on htmlpreview
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(5, 10, 7);
    scene.add(light, new THREE.AmbientLight(0x404040, 1));

    const floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshStandardMaterial({ color: 0x7cfc00 }));
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    const store = new THREE.Mesh(new THREE.BoxGeometry(10, 6, 8), new THREE.MeshStandardMaterial({ color: 0x8b00ff }));
    store.position.set(20, 3, 0);
    scene.add(store);

    const baby = new THREE.Group();
    const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.4, 0.6, 4, 8), new THREE.MeshStandardMaterial({ color: 0xffdbac }));
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.5), new THREE.MeshStandardMaterial({ color: 0xffdbac }));
    head.position.y = 1;
    baby.add(body, head);
    baby.position.set(0, 0.8, 0);
    scene.add(baby);

    const bike = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.8, 3), new THREE.MeshStandardMaterial({ color: 0xff0000 }));
    bike.position.set(22, 0.4, 0);
    scene.add(bike);

    const waterGun = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 1), new THREE.MeshStandardMaterial({ color: 0x00bfff }));
    waterGun.position.set(20, 1, 0);
    scene.add(waterGun);

    const enemies = [];
    for (let i = 0; i < 3; i++) {
      const enemy = new THREE.Mesh(new THREE.SphereGeometry(0.6), new THREE.MeshStandardMaterial({ color: 0x8b4513 }));
      enemy.position.set(Math.random() * 40 - 20, 0.6, Math.random() * 40 - 20);
      enemy.userData = { health: 3, speed: 0.02 };
      scene.add(enemy);
      enemies.push(enemy);
    }

    const bullets = [];
    let hasWeapon = false, onBike = false, health = 100, chaos = 0;
    let velocity = new THREE.Vector3();
    let gameStarted = false;
    
    camera.position.set(0, 5, 10);
    const keys = {};
    document.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    document.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
    
    // FIXED BUTTON - uses addEventListener
    document.getElementById('startBtn').addEventListener('click', () => {
      document.getElementById('title').style.display = 'none';
      gameStarted = true;
      console.log('Game started!');
    });

    function jump() { if (baby.position.y <= 0.81) velocity.y = 0.3; }
    function mountBike() {
      if (baby.position.distanceTo(bike.position) < 3) {
        onBike = !onBike;
      }
    }
    function shoot() {
      if (!hasWeapon) return;
      const bullet = new THREE.Mesh(new THREE.SphereGeometry(0.1), new THREE.MeshStandardMaterial({ color: 0x00ffff }));
      bullet.position.copy(baby.position);
      bullet.position.y += 0.5;
      const dir = new THREE.Vector3(0,0,-1);
      dir.applyQuaternion(baby.quaternion);
      if(velocity.length() > 0.01) dir.copy(velocity).normalize();
      else {
        const camDir = new THREE.Vector3();
        camera.getWorldDirection(camDir);
        camDir.y = 0;
        dir.copy(camDir);
      }
      bullet.userData = { vel: dir.multiplyScalar(0.8) };
      scene.add(bullet);
      bullets.push(bullet);
    }

    window.addEventListener('keydown', e => { 
      if (e.key === ' ') jump(); 
      if (e.key === '6') mountBike(); 
      if (e.key.toLowerCase() === 'e') shoot();
    });

    function updateHUD() {
      document.getElementById('hud').textContent = `Health: ${health} | Chaos: ${chaos} | Weapon: ${hasWeapon ? 'Water Gun' : 'None'}`;
    }

    function animate() {
      requestAnimationFrame(animate);
      if(!gameStarted) { renderer.render(scene, camera); return; }
      
      const speed = onBike ? (keys['shift'] ? 0.5 : 0.3) : 0.1;
      if (keys['w']) velocity.z = -speed;
      if (keys['s']) velocity.z = speed;
      if (keys['a']) velocity.x = -speed;
      if (keys['d']) velocity.x = speed;
      
      if (onBike) {
        bike.position.add(new THREE.Vector3(velocity.x, 0, velocity.z));
        baby.position.copy(bike.position);
        baby.position.y = 1.4;
      } else {
        baby.position.add(new THREE.Vector3(velocity.x, 0, velocity.z));
      }
      
      const target = onBike ? bike.position : baby.position;
      camera.position.lerp(new THREE.Vector3(target.x, target.y + 5, target.z + 10), 0.1);
      camera.lookAt(target);
      
      velocity.y -= 0.01;
      baby.position.y += velocity.y;
      if (baby.position.y < 0.8) { baby.position.y = 0.8; velocity.y = 0; }
      velocity.x *= 0.9; velocity.z *= 0.9;
      
      if (!hasWeapon && baby.position.distanceTo(waterGun.position) < 2) {
        hasWeapon = true;
        waterGun.visible = false;
        updateHUD();
      }
      
      bullets.forEach((b, i) => {
        b.position.add(b.userData.vel);
        enemies.forEach((e) => {
          if (e.visible && b.position.distanceTo(e.position) < 1) {
            e.userData.health--;
            chaos += 10;
            scene.remove(b);
            if (e.userData.health <= 0) { e.visible = false; chaos += 50; }
            updateHUD();
          }
        });
      });
      
      enemies.forEach(e => {
        if (!e.visible) return;
        const dir = new THREE.Vector3().subVectors(baby.position, e.position).normalize();
        dir.y = 0;
        e.position.add(dir.multiplyScalar(e.userData.speed));
        if (e.position.distanceTo(baby.position) < 1.5) { health -= 0.1; updateHUD(); }
      });
      
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
